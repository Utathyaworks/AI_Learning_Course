  - 'Multiple testing: Bonferroni, Holm, Benjamini–Hochberg; OLS inference'
  - 'Bayesian inference: conjugate priors, credible intervals, A/B tests'
  - 'Losses ∥ metrics: bootstrap CIs for F1/AUC; paired tests on per-example losses'
