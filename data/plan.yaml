- id: W01
  kind: topic
  phase: 1
  title: Vectors and matrices ∥ Python OOP and NumPy
  math:
  - Vector spaces, span, independence
  - Inner products; prove Cauchy–Schwarz
  - Matmul derived as composition of maps
  - Gram–Schmidt and QR; determinant as volume
  build:
  - Python object model; Vector and Matrix classes
  - NumPy buffers, strides, broadcasting, views vs copies
  - Generators, decorators, context managers
  - dlkit package with tests and CI
  deliverable: dlkit.Tensor tested; QR matches NumPy; CI green.
  paper_idea: How low-rank can a vision–language projector be?
  tasks:
  - w01_gram_schmidt
  - w01_broadcast_shape
- id: W01B
  kind: topic
  phase: 1
  title: Coordinate geometry and rigid transforms ∥ dlkit.geometry
  math:
  - Coordinate systems; distance and the pairwise-distance identity
  - Lines, planes, hyperplanes; point-to-plane signed distance; margins
  - Conics as quadratic forms; Gaussian contours as ellipses
  - 'Rotations: 2D/3D matrices, Euler angles, Rodrigues, quaternions'
  - Homogeneous coordinates, affine maps, the pinhole camera
  - 'Polygons: shoelace area, convex hull, barycentric coordinates'
  build:
  - Vectorized distance matrices
  - Conic and covariance-ellipse fitting
  - Rotation library (matrix, axis–angle, quaternion, slerp)
  - Transform chains and camera projection
  - dlkit.geometry with tests and CI
  deliverable: dlkit.geometry package and a classifier-geometry notebook.
  paper_idea: Does the rotation representation matter for wearable sensors?
  key_results:
  - Signed distance to w·x + b = 0 is (w·x + b)/‖w‖
  - 'Rodrigues: R = I + sinθ K + (1 − cosθ) K²'
  - 'Pinhole: x ~ K[R | t]X, divide by depth'
  - Shoelace area = ½ Σ (x_i y_{i+1} − x_{i+1} y_i)
  tasks:
  - w01b_lines_polygons
  - w01b_rotations_camera
- id: D1
  kind: depth
  phase: 1
  title: 'Depth: Linear algebra and geometry in depth'
  covers:
  - W01
  - W01B
  math:
  - 'Proofs: spectral theorem for symmetric matrices; existence of the SVD; Eckart–Young (best rank-k approximation)'
  - 'Proofs: Householder QR and why it is more stable than Gram–Schmidt; SO(3) is a group but not a vector space; quaternions
    double-cover SO(3); a homography has 8 degrees of freedom'
  - 'Original papers, three passes: Trefethen & Bau lectures 4–5 and 10 (SVD, Householder); Zhou et al. 2019 On the Continuity
