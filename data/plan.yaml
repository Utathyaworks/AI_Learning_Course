- id: W06A
  kind: topic
  phase: 2
  title: Formulating optimization problems ∥ every ML and DL method as an objective
  math:
  - 'Anatomy: decision variables, objective, constraints, feasible set; standard form; equivalent reformulations (monotone
    transforms, epigraph, slack variables)'
  - 'Convexity as a modelling property: convex sets and functions, operations that preserve convexity, disciplined convex
    programming rules'
  - 'Problem classes: LP, QP, SOCP, integer programs; turning |x|, max and L1 into LPs; norm constraints into SOCPs; LP geometry
    (vertices)'
  - 'Learning as optimization: empirical risk minimization; MLE → negative log-likelihood, MAP → regularizer; penalized vs
    constrained forms (Lagrangian equivalence); surrogate losses; objective vs metric mismatch'
  - 'Deep-learning objectives: non-convex compositions; multi-objective (weighted sums, Pareto fronts); constrained training
    via Lagrangians; bilevel (hyperparameters, meta-learning); minimax (GANs, adversarial training); RL''s expected return'
  - 'Objective this week: write the formal problem — variables, objective, constraints, convex or not, solver — for 12 models
    from linear regression to DPO and diffusion'
  build:
  - Model 5 real problems (diet, portfolio, scheduling, LAD regression, max-margin) in scipy.optimize and cvxpy
  - LAD regression as an LP; Markowitz portfolio as a QP with its efficient frontier
  - 'Ridge penalized vs norm-ball constrained: trace the λ ↔ radius map'
  - Projected and proximal gradient (lasso, simplex constraints)
  - 'Objective zoo notebook: 12 ML/DL objectives, each formal and coded'
  deliverable: 'An objective-zoo notebook: 12 ML/DL methods written as formal optimization problems, coded and solved.'
  paper_idea: When does the training objective disagree with the evaluation metric?
  key_results:
  - Every problem = variables + objective + constraints; reformulate until a known class fits
  - '|x|, max and L1 become linear with an epigraph variable'
  - Penalized and constrained forms trace the same solution path (via the Lagrange multiplier)
  - MLE ⇒ minimize NLL; MAP ⇒ add −log prior as a regularizer
  tasks:
  - w06a_formulations
  - w06a_lp_reformulation
