  - w02_ridge
- id: W02B
  kind: topic
  phase: 1
  title: Functions and their graphs ∥ visualization for intuition
  math:
  - 'Functions: domain, range, composition, inverse; graph transformations a·f(b(x−c))+d'
  - 'Families: linear, polynomial (roots, end behaviour), rational (asymptotes), absolute value, piecewise and step (ReLU,
    Heaviside)'
  - Exponential, logarithm, power laws; semilog and log-log plots turn them into lines; sigmoid, tanh, softplus shapes; periodic
    functions
  - 'Functions of two variables: surfaces, contour (level-set) plots, heatmaps, vector fields; quadratic forms as bowls, saddles
    and ridges'
  - 'Reading data plots: histogram, KDE, box/violin, scatter, line, bar, heatmap, pair plots; loss, learning, calibration
    and ROC curves; misleading axes'
  - 'Sketch before you plot: limits, continuity, monotonicity, convexity by chords, growth-rate comparison (log n, n, n²,
    eⁿ)'
  - 'Objective this week: an objective is a function — its graph shows minima, flat regions, kinks and saddles before any
    calculus'
  build:
  - 'dlkit.viz: function explorer with transformations (matplotlib, interactive sliders)'
  - Gallery of 20 function families, each sketched by hand first, then plotted
  - Log-log fit of a power law; semilog test for exponential growth
  - Surface + contour + vector-field views of quadratics and the Rosenbrock function
  - Plot-reading drills on real loss curves and learning curves; redraw a misleading chart honestly
  deliverable: dlkit.viz and a 20-family function gallery with hand sketches next to plots.
  paper_idea: Do loss-landscape visualizations predict generalization?
  key_results:
  - 'a·f(b(x−c))+d: c shifts right, d up, b compresses, a stretches'
  - y = a·x^k is a line of slope k on log-log axes; y = a·e^{kx} is a line on semilog-y
  - 'Quadratic xᵀAx: eigenvalue signs decide bowl, saddle or ridge'
  - Convex ⇔ every chord lies above the graph
  tasks:
  - w02b_function_graphs
  - w02b_level_sets
