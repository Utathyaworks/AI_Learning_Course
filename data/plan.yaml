  build:
  - 'Reproduce (A100, light): Zhou et al.''s rotation-regression experiment — Euler vs quaternion vs 6D representations on
    point-cloud pose; 3 seeds'
  - 'Inside the model: plot the learned error against rotation angle and show where the quaternion and Euler models jump (the
    discontinuity). Extension: pilot the Week 1B idea on a HAR dataset. Carried-over items from Weeks 1–1B'
  deliverable: prove what Weeks 1 and 1B used, and reproduce one result where the geometry decides whether a network can learn.
  key_results: []
  tasks: []
- id: W02
  kind: topic
  phase: 1
  title: Least squares ∥ Pandas, SQL, regression
  math:
  - Gaussian elimination and LU
  - Rank–nullity; projections
  - Normal equations derived; QR least squares
