max_end_date: '2028-01-16'
entries:
- id: W00
  kind: tooling
  phase: 0
  days: 4
  title: Linux, Git and GitHub
  math:
  - Linux filesystem, permissions, processes, pipes and redirection
  - Shell scripting and environment variables
